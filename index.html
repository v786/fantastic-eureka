
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Depths - Roguelike</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="game">
  <h1>THE DEPTHS</h1>
  <div class="game-layout">
    <div class="game-column">
      <canvas id="game" width="800" height="600" aria-label="The Depths roguelike game"></canvas>

      <div class="touch-controls" aria-label="Game controls">
        <div class="dpad">
          <button type="button" data-action="up" aria-label="Move up">▲</button>
          <button type="button" data-action="left" aria-label="Move left">◀</button>
          <span></span>
          <button type="button" data-action="right" aria-label="Move right">▶</button>
          <button type="button" data-action="down" aria-label="Move down">▼</button>
        </div>
        <div class="action-controls">
          <button type="button" data-action="wait">Wait</button>
          <button type="button" data-action="pickup">Pick up</button>
          <button type="button" data-action="heal">Potion</button>
          <button type="button" onclick="openSkills()">Skills</button>
        </div>
      </div>
    </div>

    <aside class="side-panel">
      <section>
        <h2>Character</h2>
        <div id="className"></div>
        <div id="level"></div>
        <div id="hp"></div>
        <div id="attack"></div>
        <div id="xpText"></div>
        <div class="xp-track"><div id="xpFill"></div></div>
        <div id="skillPoints"></div>
      </section>
      <section>
        <h2>Inventory</h2>
        <div id="gold"></div>
        <div id="potions"></div>
        <div id="weapon"></div>
      </section>
      <section class="log-section">
        <h2>Activity</h2>
        <div id="log"></div>
      </section>
      <button type="button" id="resumeButton" onclick="resumeGame()" hidden>Resume game</button>
      <button type="button" onclick="restart()">New game</button>
    </aside>
  </div>
</main>
<script src="assets/js/game.js"></script>
</body>
</html>
